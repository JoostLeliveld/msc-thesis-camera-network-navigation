camera_intrinsics:
  img_width: 1280
  img_height: 720
  fov_h_rad: 1.5708

worlds:
  warehouse_aws.world.sdf:
    world_name: warehouse_aws
    investigation_focus: Corrected AWS-style Experiment B extension world with an 11.0 m by 10.0 m footprint, split R1-R5 rack rows, narrow rack footprints, reachable driveable aisles, explicit green visual-only driveable boundaries, red non-driveable box/staging spots, and a loading/dispatch apron pulled away from the camera wall. The earlier R4 high stack was removed on purpose; the current world uses low crates and rack geometry only. Visibility differences must therefore be read from the accepted camera view and AWS-specific GP artifact, not from an assumed tall-stack occluder. The B1 start is in the A4-side shelf-pick pose, and the neighboring A3 route is a modest more-visible detour candidate. Learned visibility must come from an AWS-specific GP artifact with P_conservative_plan_map.
    route_choice_design: B1_apron_a4_to_uppermid_a3 is the active AWS route-choice diagnostic. The robot starts at (3.2, -1.0) on the A4 side facing east toward the R5 shelf after a hypothetical pick, and must reach the A3-side mid-cross-aisle goal at (1.0, 1.75). Route choice must emerge from planner-facing reliability and EFE costs, not mission waypoints.
    recommended_task: B1_apron_a4_to_uppermid_a3
    spawn: {x: 3.20, y: -1.00, z: 0.05, yaw: 0.0}
    planner_default: visibility_aware_efe
    visibility_artifact: data/visibility_gp/warehouse_aws_empirical_visibility_gp.npz
    visibility_defaults:
      visibility_map_min_x: -5.5
      visibility_map_max_x: 5.5
      visibility_map_min_y: -5.0
      visibility_map_max_y: 5.0
      visibility_map_nx: 220
      visibility_map_ny: 200
      visibility_gp_length_scale: 1.20
      visibility_gp_noise_var: 0.10
      visibility_prior_occ: 0.005
      visibility_beta: 1.0
      visibility_target_height_m: 0.35
    start_goal_pads:
      S_apron_left:  {x: -4.25, y: -3.15, role: loading_apron_dispatch_start, visibility_type: open_visible}
      S_apron_right: {x: 2.15, y: -3.15, role: shipping_apron_route_choice_start, visibility_type: open_visible}
      S_rack_west:   {x: -5.05, y: 0.10, role: west_service_lane_start, visibility_type: moderate_visibility}
      S_rack_south:  {x: -4.85, y: -1.55, role: west_lower_cross_aisle_start, visibility_type: open_to_occluded_transition}
      S_far_corner:  {x: -5.05, y: 4.45, role: far_upper_storage_start, visibility_type: low_coverage_or_prior_region}
      G_pick_A_visible: {x: 3.25, y: -2.10, role: a4_visible_handoff_target_before_r4_shadow, visibility_type: open_visible}
      G_pick_A:      {x: 3.25, y: 1.72, role: a4_mid_cross_picking_target, visibility_type: partially_occluded_shelf_end}
      G_pick_B:      {x: -0.975, y: 1.72, role: visible_picking_target, visibility_type: visible_shelf_end}
      G_drop_apron:  {x: -0.20, y: -3.15, role: dispatch_dropoff, visibility_type: open_visible}
      G_far_rack:    {x: 4.85, y: 4.55, role: far_corner_rack_endpoint, visibility_type: long_horizon_stress}
      G_shadow_exit: {x: 1.35, y: 1.72, role: post_occlusion_reacquisition_target, visibility_type: reacquisition_test}
    known_2d_regions:
      - {name: loading_apron_drive_lane, type: traversable, xmin: -5.10, xmax: 5.10, ymin: -3.45, ymax: -2.85, note: green driveable dispatch/loading lane pulled away from the camera wall; not a visibility reward}
      - {name: lower_main_aisle, type: traversable, xmin: -5.15, xmax: 5.15, ymin: -2.85, ymax: -2.03, note: lower route-choice corridor}
      - {name: mid_cross_aisle, type: traversable, xmin: -4.85, xmax: 4.85, ymin: 1.25, ymax: 2.03, note: open mid cross-aisle through split rack rows}
      - {name: upper_cross_aisle, type: traversable, xmin: -4.85, xmax: 4.85, ymin: 4.25, ymax: 4.90, note: upper visible detour candidate for B1}
      - {name: west_service_lane, type: traversable, xmin: -5.15, xmax: -4.60, ymin: -3.45, ymax: 4.80, note: west-side rack access lane}
      - {name: east_far_corner_route, type: traversable, xmin: 4.65, xmax: 5.15, ymin: -3.45, ymax: 4.80, note: long-horizon east-side route used by B3}
      - {name: rack_aisle_A1, type: traversable, xmin: -3.475, xmax: -2.575, ymin: -2.85, ymax: 4.80, note: 0.90 m marked driveable lane between R1 and R2}
      - {name: rack_aisle_A2, type: traversable, xmin: -1.425, xmax: -0.525, ymin: -2.85, ymax: 4.80, note: 0.90 m marked driveable lane between R2 and R3}
      - {name: rack_aisle_A3, type: traversable, xmin: 0.625, xmax: 1.525, ymin: -2.85, ymax: 4.80, note: visible detour lane for B1}
      - {name: rack_aisle_A4, type: traversable, xmin: 2.575, xmax: 3.675, ymin: -2.85, ymax: 4.80, note: 1.10 m driveable lane between R4 and R5; widened from 0.90 m for realistic clearance under EKF uncertainty. Current visibility effects come from the camera viewpoint, rack geometry, low crates, and the fitted GP, not a high floor stack.}
      - {name: shelf_end_box_spot_R1, type: non_driveable_staging, xmin: -4.46, xmax: -3.64, ymin: -1.66, ymax: -0.88, note: red shelf-end pad outside the green driveable union; low crate only}
      - {name: shelf_end_box_spot_R2, type: non_driveable_staging, xmin: -2.41, xmax: -1.59, ymin: -1.66, ymax: -0.88, note: red shelf-end pad outside the green driveable union; low crate only}
      - {name: shelf_end_box_spot_R3, type: non_driveable_staging, xmin: -0.36, xmax: 0.46, ymin: -1.66, ymax: -0.88, note: red shelf-end pad outside the green driveable union; low crate only}
      - {name: shelf_end_box_spot_R4, type: non_driveable_staging, xmin: 1.725, xmax: 2.275, ymin: -1.685, ymax: -0.845, note: red shelf-end pad south of R4 rack body; low crate only (R4 high stack removed v5; original bbox preserved per floor-plan convention)}
      - {name: shelf_end_box_spot_R5, type: non_driveable_staging, xmin: 3.74, xmax: 4.56, ymin: -1.66, ymax: -0.88, note: red shelf-end pad outside the green driveable union; low crate only}
      - {name: wall_side_staging_left, type: non_driveable_staging, xmin: -5.03, xmax: -3.83, ymin: -4.20, ymax: -3.64, note: wall-side red staging pad, pulled 0.8 m away from the camera wall}
      - {name: wall_side_receiving, type: non_driveable_staging, xmin: -0.93, xmax: 0.68, ymin: -4.20, ymax: -3.64, note: wall-side red receiving pad; green apron lane is north of it}
      - {name: wall_side_shipping, type: non_driveable_staging, xmin: 2.08, xmax: 3.68, ymin: -4.20, ymax: -3.64, note: wall-side red shipping pad; green apron lane is north of it}
      - {name: wall_side_charging, type: non_driveable_staging, xmin: 4.05, xmax: 5.00, ymin: -4.20, ymax: -3.64, note: wall-side red charging pad; green apron lane is north of it}
    occlusion_annotations:
      - name: OZ_A_a4_low_reliability_band
        cause: South-wall camera viewpoint, R4/R5 rack geometry, low shelf-end crates, and perspective effects reduce learned observation reliability in parts of A4. The former R4 high stack is intentionally absent in the current world.
        traversability: driveable_centerline
        learned_by: AWS visibility capture v5 and GP fit
        expected_effect: lower YOLO score / higher observation covariance in the A4-side corridor relative to the neighboring A3 detour. This is an empirical learned-reliability region, not a physical wall.
        approx_region: {xmin: 2.30, xmax: 3.60, ymin: -1.685, ymax: 3.50}
      - name: OZ_B_loaded_rack_band
        cause: shelf/rack visual structure and low shelf contents near aisle edges
        traversability: driveable_aisles
        learned_by: AWS visibility capture and GP fit
        expected_effect: partial detections and mask-centroid bias risk near rack rows
        approx_region: {xmin: -4.35, xmax: 4.35, ymin: -0.65, ymax: 4.25}
      - name: OZ_C_far_corner_low_coverage
        cause: long range and oblique camera angle in the upper east/far-corner route
        traversability: driveable_if_lane_marked
        learned_by: GP coverage / prior if under-sampled
        expected_effect: conservative planner should avoid overtrusting sparse far-corner observations
        approx_region: {xmin: 4.55, xmax: 5.15, ymin: 3.80, ymax: 4.80}
      - name: OZ_D_reacquisition_zone
        cause: robot exits the A4 low-reliability band into the open mid cross-aisle
        traversability: driveable
        learned_by: AWS visibility capture and GP fit
        expected_effect: visibility improves after the occluded segment
        approx_region: {xmin: 0.80, xmax: 1.80, ymin: 1.25, ymax: 2.03}
    r4_occluder_variants:
      low:    {height_m: 1.20, width_m: 0.24, expected_regime: weak_occlusion}
      medium: {height_m: 1.90, width_m: 0.32, expected_regime: main_partial_occlusion}
      high:   {height_m: 2.60, width_m: 0.38, expected_regime: main_partial_to_strong_occlusion}
  warehouse_full_4cam.world.sdf:
    world_name: warehouse_full_4cam
    investigation_focus: Flagship AWS-mesh-styled large warehouse (~24 x 20 m) with four wall-mounted external cameras at (-6.0,-10), (-6.0,10), (6.0,-10), and (6.0,10). South-wall cameras look north; north-wall cameras look south. The camera columns are brought inward to widen adjacent-camera overlap for validated handover. Generated by scripts/geometry_visibility/make_warehouse_full.py. Full dressed layout - real ShelfD/E mesh visual overlays on box-collision racks, a 4.5 m central aisle, one west-wall-backed one-sided shelf row, docks, staging clutter meshes, hanging lamps, blue site bounds, conservative green no-go envelopes, and asymmetric tall handover segments. The planner driveable union is the cyan aisle network documented on the generated map.
    recommended_task: full_traverse_handover
    spawn: {x: 0.00, y: -7.80, z: 0.05, yaw: 1.5708}
    planner_default: visibility_aware_efe
    visibility_defaults:
      visibility_map_min_x: -11.7
      visibility_map_max_x: 11.7
      visibility_map_min_y: -9.0
      visibility_map_max_y: 9.0
      visibility_map_nx: 470
      visibility_map_ny: 360
      visibility_gp_length_scale: 1.20
      visibility_gp_noise_var: 0.10
      visibility_prior_occ: 0.005
      visibility_beta: 1.0
      visibility_target_height_m: 0.35
    known_2d_regions:
      # Keep-in envelope, NOT a lane. It is deliberately not `traversable`: the
      # driveable union is what paper 1's lane-graph seeding validates Manhattan
      # routes against, so a floor-wide rectangle would make every route "valid",
      # including ones straight through the rack rows. The lanes below carry the
      # aisle structure the way warehouse_aws does.
      - {name: open_floor_inside_site_boundary, type: site_boundary, xmin: -11.20, xmax: 11.50, ymin: -8.60, ymax: 8.60, note: physical operating field; blue lines mark its boundary and green marks obstacle envelopes}
      # North-south aisles use the exact free gap between 0.32 m rack envelopes.
      # Historical lane annotations remain for non-thesis worlds and visualization;
      # warehouse_v2 planning uses collision-derived keep-out geometry instead.
      - {name: west_service_lane, type: traversable, xmin: -10.95, xmax: -9.42, ymin: -8.35, ymax: 8.35, note: lane between the west wall-backed shelf and rack column W1}
      - {name: rack_aisle_W3, type: traversable, xmin: -8.23, xmax: -7.32, ymin: -8.35, ymax: 8.35, note: aisle between rack columns W1 and W2}
      - {name: rack_aisle_W2, type: traversable, xmin: -6.13, xmax: -5.22, ymin: -8.35, ymax: 8.35, note: continuous west aisle 2; loose mid-aisle box stacks were removed}
      - {name: rack_aisle_W1, type: traversable, xmin: -4.03, xmax: -3.12, ymin: -8.35, ymax: 8.35, note: aisle between rack columns W3 and W4}
      # The full 3.86 m-wide central corridor is retained away from the pillar;
      # only its local 1.14 m envelope is carved into west/east bypasses.
      - {name: central_aisle_south, type: traversable, xmin: -1.93, xmax: 1.93, ymin: -8.35, ymax: -1.47, note: full central aisle south of the support pillar}
      - {name: central_pillar_bypass_west, type: traversable, xmin: -1.93, xmax: -0.57, ymin: -1.47, ymax: -0.33, note: west-side bypass around the support-pillar envelope}
      - {name: central_pillar_bypass_east, type: traversable, xmin: 0.57, xmax: 1.93, ymin: -1.47, ymax: -0.33, note: east-side bypass around the support-pillar envelope}
      - {name: central_aisle_north, type: traversable, xmin: -1.93, xmax: 1.93, ymin: -0.33, ymax: 8.35, note: full central aisle north of the support pillar}
      - {name: rack_aisle_E1, type: traversable, xmin: 3.12, xmax: 4.03, ymin: -8.35, ymax: 8.35, note: aisle between rack columns E1 and E2}
      - {name: rack_aisle_E2, type: traversable, xmin: 5.22, xmax: 6.13, ymin: -8.35, ymax: 8.35, note: aisle between rack columns E2 and E3}
      - {name: rack_aisle_E3, type: traversable, xmin: 7.32, xmax: 8.23, ymin: -8.35, ymax: 8.35, note: aisle between rack columns E3 and E4}
      - {name: east_service_lane, type: traversable, xmin: 9.42, xmax: 11.25, ymin: -8.35, ymax: 8.35, note: continuous east service lane after removal of the artificial pallet-box island}
      # Rack bands were shortened to make 1.60 m physical cross-aisles. Their
      # mapped 0.96 m widths are the exact gaps between adjoining green envelopes.
      - {name: south_perimeter_aisle, type: traversable, xmin: -10.95, xmax: 11.25, ymin: -8.35, ymax: -6.82, note: cross aisle south of the lower rack band}
      - {name: lower_cross_aisle, type: traversable, xmin: -10.95, xmax: 11.25, ymin: -2.48, ymax: -1.52, note: widened cross aisle between the lower and middle rack bands}
      - {name: upper_cross_aisle, type: traversable, xmin: -10.95, xmax: 11.25, ymin: 1.92, ymax: 2.88, note: widened cross aisle between the middle and upper rack bands}
      - {name: north_perimeter_aisle, type: traversable, xmin: -10.95, xmax: 11.25, ymin: 7.22, ymax: 8.35, note: cross aisle north of the upper rack band}
      # These are operational envelopes, not exact-fit object footprints. Each
      # extends 0.32 m beyond its outer collision footprint, matching the green
      # floor paint and the geometry shown on the live dashboard.
      - {name: west_wall_backed_one_sided_shelf, type: non_driveable_obstacle, xmin: -12.23, xmax: -11.04, ymin: -6.82, ymax: 7.22, note: conservative envelope around the wall-backed shelf row; reachable only from its east side}
      - {name: central_support_pillar, type: non_driveable_obstacle, xmin: -0.57, xmax: 0.57, ymin: -1.47, ymax: -0.33, note: conservative envelope around the fixed building column}
  # Active asymmetric five-camera world family for calibrated fusion paper v2.
  # The peak state is primary; shipout below is a paired transfer condition.
  warehouse_v2.world.sdf: &warehouse_v2_peak_profile
    world_name: warehouse_v2
    stock_state: peak
    evidence_role: primary_commissioning_and_evaluation
    paired_world: warehouse_v2_shipout.world.sdf
    geometry_freeze_id: WHV2-GEOMETRY-V1
    camera_layout_decision_id: WHV2-CAMLAYOUT-V1
    evidence_status: geometry_only_no_detector_data
    investigation_focus: >-
      Three-section warehouse: north-south selective racking in the west (top beam
      5.23 m), racking turned 90 degrees in the north-east (top beam 2.61 m), and
      floor block-stacking in the south-east where the same pallet is stacked one,
      two and three high. The map declares the storage ZONES; what is inside them
      is not in the map and changes between stock states, so the drivable map
      carries no visibility information. Five cameras, no mirrored pair.
      Generated by world/make_world.py.
    recommended_task: fusion_overlap_primary
    spawn: {x: 0.55, y: -7.50, z: 0.05, yaw: 1.5708}
    planner_default: visibility_aware_efe
    camera_ids: [camera_A, camera_B, camera_C, camera_D, camera_E]
    camera_model_includes: [external_camera, external_camera_b, external_camera_c, external_camera_d, external_camera_e]
    camera_image_topics: [/external_camera/image_raw, /external_camera_b/image_raw, /external_camera_c/image_raw, /external_camera_d/image_raw, /external_camera_e/image_raw]
    occlusion_model_names: [warehouse_v2_occluders]
    collision_model_names: [warehouse_shell, warehouse_v2_occluders]
    # REQUIRED: these five are top-level <include> models, not inside the two model
    # groups above. Omitting them yields 44 prisms instead of 56 and silently drops
    # the bin, forklift, pallet jack and both loose pallets.
    collision_include_names: [forklift_parked, pallet_jack, bin_office, pallet_loose_1, pallet_loose_2]
    visibility_defaults:
      visibility_map_min_x: -11.35
      visibility_map_max_x: 11.35
      visibility_map_min_y: -9.35
      visibility_map_max_y: 9.35
      visibility_map_nx: 455
      visibility_map_ny: 374
      visibility_gp_length_scale: 1.20
      visibility_gp_noise_var: 0.10
      visibility_prior_occ: 0.005
      visibility_beta: 1.0
      visibility_target_height_m: 0.35
    # Route-seed corridor centre-lines for optimizer_route_seed_mode: lane_graph.
    # Declared because corridor centres cannot be inferred from an obstacle map.
    # Verified against the +0.10 m obstacle map: the main aisles are 100% free; the
    # cross-aisles pass rack blocks by design and the segment check rejects those spans.
    route_horizontal_centres: [-8.725, -6.25, -5.75, -1.175, 2.425, 6.35, 8.625]
    route_vertical_centres: [-10.875, -6.95, -3.05, 0.975, 10.775]
    known_2d_regions:
      - {name: open_floor_inside_site_boundary, type: site_boundary, xmin: -11.35, xmax: 11.35, ymin: -9.35, ymax: 9.35, note: operating field; a planner bound, deliberately NOT painted on the floor}
      - {name: warehouse_shell:wall_east, type: non_driveable_obstacle, xmin: 11.800, xmax: 12.200, ymin: -10.100, ymax: 10.100, note: obstacle footprint grown by 0.10 m a side; everything else is traversable}
      - {name: warehouse_shell:wall_west, type: non_driveable_obstacle, xmin: -12.200, xmax: -11.800, ymin: -10.100, ymax: 10.100, note: obstacle footprint grown by 0.10 m a side; everything else is traversable}
      - {name: warehouse_shell:wall_north, type: non_driveable_obstacle, xmin: -12.100, xmax: 12.100, ymin: 9.800, ymax: 10.200, note: obstacle footprint grown by 0.10 m a side; everything else is traversable}
      - {name: warehouse_shell:wall_south_0, type: non_driveable_obstacle, xmin: -12.100, xmax: -10.000, ymin: -10.200, ymax: -9.800, note: obstacle footprint grown by 0.10 m a side; everything else is traversable}
      - {name: warehouse_shell:wall_south_1, type: non_driveable_obstacle, xmin: -7.000, xmax: -3.000, ymin: -10.200, ymax: -9.800, note: obstacle footprint grown by 0.10 m a side; everything else is traversable}
      - {name: warehouse_shell:wall_south_2, type: non_driveable_obstacle, xmin: 0.000, xmax: 4.000, ymin: -10.200, ymax: -9.800, note: obstacle footprint grown by 0.10 m a side; everything else is traversable}
      - {name: warehouse_shell:wall_south_3, type: non_driveable_obstacle, xmin: 7.000, xmax: 12.100, ymin: -10.200, ymax: -9.800, note: obstacle footprint grown by 0.10 m a side; everything else is traversable}
      - {name: warehouse_v2_occluders:obs_A1b1w, type: non_driveable_obstacle, xmin: -9.950, xmax: -8.870, ymin: -4.500, ymax: -0.384, note: obstacle footprint grown by 0.10 m a side; everything else is traversable}
      - {name: warehouse_v2_occluders:obs_A1b1e, type: non_driveable_obstacle, xmin: -8.930, xmax: -7.850, ymin: -4.500, ymax: -0.384, note: obstacle footprint grown by 0.10 m a side; everything else is traversable}
