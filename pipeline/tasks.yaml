tasks:
  # Task identifiers are frozen because the final campaign manifests use them.
  # Descriptions below state only the final experiment intent.
  warehouse_v2.world.sdf: &warehouse_v2_tasks
  - name: thesis10_camera_a_western_dock_detour
    description: Western dock traverse used to measure route choice after removing camera A.
    start: {x: -10.7, y: 8.55, z: 0.05, yaw: -1.5708}
    goal: {x: -6.95, y: -8.5}
    route_seeds:
    - name: west_south_crossing
      waypoints: [[-10.7, -6.25], [-6.95, -6.25], [-6.95, -8.5]]
    - name: west_lower_crossing
      waypoints: [[-10.7, -5.75], [-6.95, -5.75], [-6.95, -8.5]]
    - name: west_middle_aisle
      waypoints: [[-6.95, 8.55], [-6.95, -8.5]]
  - name: thesis10_camera_b_cross_warehouse_detour
    description: Cross-warehouse traverse whose northern shortcut loses coverage when camera C is removed.
    start: {x: -6.95, y: -3.0, z: 0.05, yaw: 1.5708}
    goal: {x: 0.975, y: 7.25}
    route_seeds:
    - name: south_crossing
      waypoints: [[-6.95, -6.25], [0.975, -6.25], [0.975, 7.25]]
    - name: lower_crossing
      waypoints: [[-6.95, -5.75], [0.975, -5.75], [0.975, 7.25]]
    - name: middle_aisle_north
      waypoints: [[-6.95, 8.625], [0.975, 8.625], [0.975, 7.25]]
  - name: thesis10_camera_c_inner_warehouse_detour
    description: Inner-warehouse traverse comparing a camera-B-dependent aisle with a covered alternative.
    start: {x: -3.05, y: 8.625, z: 0.05, yaw: -1.5708}
    goal: {x: 0.975, y: -5.75}
    route_seeds:
    - name: middle_aisle
      waypoints: [[-3.05, -5.75], [0.975, -5.75]]
    - name: north_east_lanes
      waypoints: [[0.975, 8.625], [0.975, -5.75]]
  - name: thesis10_camera_e_eastern_detour
    description: Eastern control traverse with four corridor alternatives; the removal condition disables camera D.
    start: {x: 10.6, y: -5.75, z: 0.05, yaw: 1.5708}
    goal: {x: 0.975, y: 8.625}
    route_seeds:
    - name: lower_crossing
      waypoints: [[0.975, -5.75], [0.975, 8.625]]
    - name: main_aisle
      waypoints: [[10.6, -1.175], [0.975, -1.175], [0.975, 8.625]]
    - name: middle_connector
      waypoints: [[10.6, 2.425], [0.975, 2.425], [0.975, 8.625]]
    - name: upper_crossing
      waypoints: [[10.6, 6.35], [0.975, 6.35], [0.975, 8.625]]
  - name: thesis10_camera_e_long_cross_warehouse_detour
    description: Three long cross-warehouse routes testing the detour induced by removing camera E.
    start: {x: -10.7, y: 8.55, z: 0.05, yaw: 0.0}
    goal: {x: 9.6, y: -1.4}
    route_seeds:
    - name: main_aisle
      waypoints: [[0.975, 8.55], [0.975, -1.175], [9.6, -1.175], [9.6, -1.4]]
    - name: middle_connector
      waypoints: [[0.975, 8.55], [0.975, 2.425], [9.925, 2.425], [9.925, -1.4], [9.6, -1.4]]
    - name: upper_crossing
      waypoints: [[0.975, 8.55], [0.975, 6.35], [10.675, 6.35], [10.675, -1.4], [9.6, -1.4]]
