study_title: Final three-seed multi-camera dropout-detour campaign
study_comparison: Global, per-camera and spatial camera-network models, each used
  consistently by runtime fusion and planning, across five matched dropout-detour tasks.
planning_information_method: inverse_of_matched_runtime_covariance
planning_artifact_schema: camera_network.matched_covariance_precision.v1
world: warehouse_v2.world.sdf
world_profiles: src/experiments/config/world_profiles.yaml
tasks_yaml: pipeline/tasks.yaml
launch_file: warehouse_primary_comparison.launch.py
tasks:
  thesis10_camera_a_western_dock_detour:
    conditions: &conditions
    - global_intact
    - global_removal
    - per_camera_intact
    - per_camera_removal
    - spatial_intact
    - spatial_removal
    seeds: &seeds
    - 91500
    - 91501
    - 91502
    condition_overrides:
      global_removal: &remove_a {manager_camera_ids: 'camera_B,camera_C,camera_D,camera_E', camera_network_active_camera_ids: 'camera_B,camera_C,camera_D,camera_E', removed_camera_id: camera_A}
      per_camera_removal: *remove_a
      spatial_removal: *remove_a
  thesis10_camera_b_cross_warehouse_detour:
    conditions: *conditions
    seeds: *seeds
    condition_overrides:
      global_removal: &remove_c_for_b {manager_camera_ids: 'camera_A,camera_B,camera_D,camera_E', camera_network_active_camera_ids: 'camera_A,camera_B,camera_D,camera_E', removed_camera_id: camera_C}
      per_camera_removal: *remove_c_for_b
      spatial_removal: *remove_c_for_b
  thesis10_camera_c_inner_warehouse_detour:
    conditions: *conditions
    seeds: *seeds
    condition_overrides:
      global_removal: &remove_b_for_c {manager_camera_ids: 'camera_A,camera_C,camera_D,camera_E', camera_network_active_camera_ids: 'camera_A,camera_C,camera_D,camera_E', removed_camera_id: camera_B}
      per_camera_removal: *remove_b_for_c
      spatial_removal: *remove_b_for_c
  thesis10_camera_e_eastern_detour:
    conditions: *conditions
    seeds: *seeds
    condition_overrides:
      global_removal: &remove_d {manager_camera_ids: 'camera_A,camera_B,camera_C,camera_E', camera_network_active_camera_ids: 'camera_A,camera_B,camera_C,camera_E', removed_camera_id: camera_D}
      per_camera_removal: *remove_d
      spatial_removal: *remove_d
  thesis10_camera_e_long_cross_warehouse_detour:
    conditions: *conditions
    seeds: *seeds
    condition_overrides:
      global_removal: &remove_e {manager_camera_ids: 'camera_A,camera_B,camera_C,camera_D', camera_network_active_camera_ids: 'camera_A,camera_B,camera_C,camera_D', removed_camera_id: camera_E}
      per_camera_removal: *remove_e
      spatial_removal: *remove_e
perception_backend: yolo
yolo_model: logs/thesis/detector/training/imgsz960/upper_finetune/weights/best.pt
yolo_device: '0'
yolo_imgsz: 960
yolo_conf_threshold: 0.25
yolo_predict_conf_floor: 0.001
yolo_iou_threshold: 0.45
yolo_target_class: robot
yolo_class_id: 0
