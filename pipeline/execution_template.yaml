goal_success_radius: 0.10
goal_success_hold_s: 2.0
# Simulated seconds after the first command; about 2x the longest route.
run_timeout_after_first_cmd_s: 90
local_controller_type: ff_fb
waypoint_spacing_m: 0.1
waypoint_arrival_radius_m: 0.1
cmd_publish_rate: 10.0
robot_collision_radius_m: 0.48541219597369
robot_length_m: 0.8
robot_width_m: 0.55
use_nogo_cost: true
nogo_mode: keep_out
nogo_penalty_type: warning_band
nogo_safe_distance: 0.0
local_nogo_safe_distance: 0.0
nogo_warning_band: 0.05
nogo_logbarrier_eps: 0.05
nogo_weight: 40.0
use_belief_nogo_cost: true
use_diagnostic_odom_localization: false
use_odom_for_predict: true
odom_topic: /odom_noisy
use_command_noise: true
use_encoder_noise: true
# Calibrated odometry: zero mean encoder scale error (METHOD amendment 2026-09-24 evening).
encoder_noise_linear_slip_mean: 0.0
encoder_noise_linear_slip_std: 0.125
encoder_noise_angular_slip_mean: 0.0
encoder_noise_angular_slip_std: 0.075
encoder_noise_linear_additive_std: 0.004
encoder_noise_angular_additive_std: 0.05
encoder_noise_correlation_alpha: 0.8
encoder_wheel_diameter_ratio_error: 0.00121
encoder_wheelbase_ratio: 0.991765
process_noise_xy: 0.02
process_noise_theta: 0.08
process_noise_model: encoder
r_visible_uv: 1.0
r_miss_uv: 40.0
headless: true
nvidia_offload: true
use_rviz: false
reset_world: false
debug_runtime: false
cleanup_mode: isolated
cleanup_sim_stragglers: false
ros_domain_id_base: 100
