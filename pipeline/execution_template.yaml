ff_fb_turn_rate_limit_rad_s: 0.8
ff_fb_corner_crawl_speed_mps: 0.18
ff_fb_pivot_heading_error_rad: 2.6
use_hierarchical: true
global_planner_mode: preselected_route
camera_network_objective: metric_expected_belief
network_goal_std_m: 0.1
network_goal_std_start_m: 5.0
goal_tightening_power: 0.9
global_horizon: 75
global_dt: 1.0
optimizer_route_seed_mode: explicit
global_optimizer_multistart: false
optimizer_multistart: false
optimizer_multistart_include_direct: false
optimizer_maxiter: 60
optimizer_maxfun: 500
optimizer_ftol: 1.0e-06
optimizer_gtol: 1.0e-05
optimizer_terminal_goal_tolerance_m: 0.1
optimizer_control_block_steps: 1
camera_network_updates_per_step: 1
discount_gamma: 0.995
risk_weight_obs: 1.0
observation_risk_scale: 1.0
ambiguity_weight: 1.0
ambiguity_term_scale: 1.0
kouw_et1_ambiguity: true
control_weight: 0.0
local_use_visibility_model: false
local_use_ambiguity: false
local_use_obs_risk: false
use_pixel_correction: false
use_hit_miss_mixture: false
v_max: 1.0
horizon: 20
dt: 0.25
# Stop on the belief at 0.10 m; success is scored offline on ground truth below 0.30 m
