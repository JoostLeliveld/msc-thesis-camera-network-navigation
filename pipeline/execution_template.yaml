# Execution template for the camera-removal campaign: one run per task x condition x seed.
# Routes are bound per seed by pipeline/bind_routes.py; artifact hashes by pipeline/campaign_configs.py.
study_title: Final three-seed multi-camera dropout-detour campaign
study_comparison: Global, per-camera and spatial camera-network models, each used
  consistently by runtime fusion and planning, across five matched dropout-detour
  tasks.
planning_information_method: inverse_of_matched_runtime_covariance
planning_artifact_schema: camera_network.matched_covariance_precision.v1
world: warehouse_v2.world.sdf
world_profiles: src/experiments/config/world_profiles.yaml
tasks_yaml: pipeline/tasks.yaml
launch_file: warehouse_primary_comparison.launch.py
tasks:
  thesis10_camera_a_western_dock_detour:
    conditions: &id002
    - global_intact
    - global_removal
    - per_camera_intact
    - per_camera_removal
    - spatial_intact
    - spatial_removal
    seeds: &id003
    - 91500
    - 91501
    - 91502
    condition_overrides:
      global_removal: &id001
        manager_camera_ids: camera_B,camera_C,camera_D,camera_E
        camera_network_active_camera_ids: camera_B,camera_C,camera_D,camera_E
        removed_camera_id: camera_A
      per_camera_removal: *id001
      spatial_removal: *id001
  thesis10_camera_b_cross_warehouse_detour:
    conditions: *id002
    seeds: *id003
    condition_overrides:
      global_removal: &id004
        manager_camera_ids: camera_A,camera_B,camera_D,camera_E
        camera_network_active_camera_ids: camera_A,camera_B,camera_D,camera_E
        removed_camera_id: camera_C
      per_camera_removal: *id004
      spatial_removal: *id004
  thesis10_camera_c_inner_warehouse_detour:
    conditions: *id002
    seeds: *id003
    condition_overrides:
      global_removal: &id005
        manager_camera_ids: camera_A,camera_C,camera_D,camera_E
        camera_network_active_camera_ids: camera_A,camera_C,camera_D,camera_E
        removed_camera_id: camera_B
      per_camera_removal: *id005
      spatial_removal: *id005
  thesis10_camera_e_eastern_detour:
    conditions: *id002
    seeds: *id003
    condition_overrides:
      global_removal: &remove_d
        manager_camera_ids: camera_A,camera_B,camera_C,camera_E
        camera_network_active_camera_ids: camera_A,camera_B,camera_C,camera_E
        removed_camera_id: camera_D
      per_camera_removal: *remove_d
      spatial_removal: *remove_d
  thesis10_camera_e_long_cross_warehouse_detour:
    conditions: *id002
    seeds: *id003
    condition_overrides:
      global_removal: &id006
        manager_camera_ids: camera_A,camera_B,camera_C,camera_D
        camera_network_active_camera_ids: camera_A,camera_B,camera_C,camera_D
        removed_camera_id: camera_E
      per_camera_removal: *id006
      spatial_removal: *id006
perception_backend: yolo
yolo_model: logs/thesis/detector/training/imgsz960/upper_finetune/weights/best.pt
yolo_device: '0'
yolo_imgsz: 960
yolo_conf_threshold: 0.25
yolo_predict_conf_floor: 0.001
yolo_iou_threshold: 0.45
yolo_target_class: robot
yolo_class_id: 0
yolo_use_masks: false
yolo_min_bbox_area_px: 0.0
yolo_max_batch_stamp_skew_s: 0.05
yolo_warmup_iters: 3
scheduled_rate_hz: 5.0
multicam_belief: true
manager_fusion_mode: true
manager_fusion_rule: independent
manager_camera_ids: camera_A,camera_B,camera_C,camera_D,camera_E
manager_covariance_profile: commissioned_visibility_r
manager_observation_model: visibility_patch
manager_sensor_gate_config_path: config/sensor_gate.yaml
manager_require_gp_artifacts: false
manager_min_spatial_trust: 0.001
